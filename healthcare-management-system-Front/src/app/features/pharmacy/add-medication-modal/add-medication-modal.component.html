<!-- src/app/features/pharmacy/add-medication-modal/add-medication-modal.component.html -->
<div
  *ngIf="visible"
  class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50 overflow-y-auto"
>
  <div
    class="bg-white rounded-lg shadow-lg w-full max-w-2xl p-6 max-h-[90vh] overflow-y-auto"
  >
    <h2 class="text-2xl font-bold mb-4">
      {{ readOnly ? 'Ver Medicamentos' : 'Add Medication' }}
    </h2>

    <!-- Contador sólo en edición -->
    <div *ngIf="!readOnly" class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Cantidad de medicamentos
      </label>
      <input
        type="number"
        [(ngModel)]="count"
        (change)="generateRows()"
        min="1"
        class="w-20 px-3 py-2 border rounded"
      />
    </div>

    <!-- Fila por fila -->
    <div *ngFor="let row of rows; let i = index" class="grid grid-cols-3 gap-4 mb-4">
      <!-- Medicamento -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Medicamento {{ i + 1 }}
        </label>
        <!-- Lectura -->
        <p *ngIf="readOnly" class="px-3 py-2 border rounded bg-gray-50">
          {{ row.medicationName 
             || getMedicationNameById(row.medicationId) 
             || '—' }}
        </p>
        <!-- Edición -->
        <select
          *ngIf="!readOnly"
          [(ngModel)]="row.medicationId"
          class="w-full px-3 py-2 border rounded"
        >
          <option [ngValue]="null" disabled>Selecciona</option>
          <option *ngFor="let m of medications" [ngValue]="m.id">
            {{ m.name }}
          </option>
        </select>
      </div>

      <!-- Cantidad -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Cantidad
        </label>
        <!-- Lectura -->
        <p *ngIf="readOnly" class="px-3 py-2 border rounded bg-gray-50">
          {{ row.quantity ?? '—' }}
        </p>
        <!-- Edición -->
        <input
          *ngIf="!readOnly"
          type="number"
          [(ngModel)]="row.quantity"
          min="1"
          class="w-full px-3 py-2 border rounded"
        />
      </div>

      <!-- Estado -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Estado
        </label>
        <!-- Lectura -->
        <p *ngIf="readOnly" class="px-3 py-2 border rounded bg-gray-50">
          {{ getStatusLabel(row.status) || '—' }}
        </p>
        <!-- Edición -->
        <select
          *ngIf="!readOnly"
          [(ngModel)]="row.status"
          class="w-full px-3 py-2 border rounded"
        >
          <option *ngFor="let s of statuses" [value]="s.value">
            {{ s.label }}
          </option>
        </select>
      </div>
    </div>

    <!-- Botones -->
    <div class="flex justify-end space-x-3 mt-6">
      <button
        (click)="close.emit()"
        class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300"
      >
        {{ readOnly ? 'Cerrar' : 'Cancel' }}
      </button>
      <button
        *ngIf="!readOnly"
        (click)="onSave()"
        class="px-4 py-2 bg-teal-600 text-white rounded hover:bg-teal-700"
      >
        Save
      </button>
    </div>
  </div>
</div>
