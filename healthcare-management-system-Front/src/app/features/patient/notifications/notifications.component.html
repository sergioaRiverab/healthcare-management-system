<div class="bg-white rounded-lg shadow-lg p-6">
  <h2 class="text-2xl font-bold mb-4">Status Notifications</h2>

  <!-- Loading con spinner -->
  <div *ngIf="loading" class="flex items-center text-gray-500 space-x-2">
    <svg class="animate-spin h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z">
      </path>
    </svg>
    <span>Cargando notificaciones...</span>
  </div>

  <!-- Error -->
  <div *ngIf="error" class="text-red-500 mt-2">{{ error }}</div>

  <!-- Lista de notificaciones -->
  <div *ngIf="!loading && !error">
    <div *ngIf="notifications.length === 0" class="text-gray-600 mb-2">
      No tienes notificaciones.
    </div>
    <ul class="space-y-2">
      <li *ngFor="let note of notifications">
        <div class="px-4 py-2 bg-gray-50 rounded border flex justify-between items-start">
          <div>
            {{ note.message }}
          </div>
          <small class="text-gray-400 ml-4">
            {{ note.createdAt | date:'short' }}
          </small>
        </div>
      </li>
    </ul>
  </div>
</div>
