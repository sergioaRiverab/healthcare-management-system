<!-- patient-dashboard.component.html -->
<div class="flex flex-col md:flex-row gap-6 p-6">
  <!-- Panel izquierdo: subida de receta -->
  <div class="w-full md:w-1/3">
    <app-prescription-upload
      [selectedPharmacy]="selectedPharmacy"
      (pharmacyChosen)="selectedPharmacy = $event"
    ></app-prescription-upload>
<app-notifications></app-notifications>

  </div>

  <!-- Panel derecho: mapa y lista de cercanas -->
  <div class="w-full md:w-2/3">
    <app-appointments
      (pharmacySelected)="selectedPharmacy = $event"
    ></app-appointments>
  </div>
    
  <div class="mt-6">
      <h3 class="text-xl font-bold">Mis Citas</h3>
      <app-generic-appointment-table
        [fetchFn]="fetchAppointmentsFn"  
        [mapFn]="mapAppointmentsFn"     
        [actions]="appointmentActions" 
      ></app-generic-appointment-table>
    </div>
  
</div>
