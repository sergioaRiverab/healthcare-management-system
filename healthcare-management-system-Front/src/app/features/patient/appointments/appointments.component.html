<div class="bg-white shadow-lg rounded-lg p-6 w-full">
  <div
    id="map"
    class="w-full h-[400px] rounded-md overflow-hidden mb-6"
  ></div>

  <div class="mt-4">
    <h3 class="text-xl font-semibold text-gray-800 mb-4">Farmacias Cercanas</h3>
    <ul class="space-y-3">
      @for (pharm of pharmacies; track pharm.id) {
        <li
          [class.selected]="pharm.id === selectedId"
          class="flex justify-between items-center p-4 rounded-lg hover:bg-gray-50 transition-colors"
        >
          <div class="text-gray-700">
            <strong class="font-medium">{{ pharm.name }}</strong>
             – <span class="font-light">{{ pharm.distance | number:'1.2-2' }} km</span>
          </div>
          <button
            (click)="onSelect(pharm.id)"
            class="ml-4 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-1 px-3 rounded-md"
          >
            Seleccionar
          </button>
        </li>
      } @empty {
        <li class="text-gray-600 italic">No hay farmacias cercanas.</li>
      }
    </ul>
  </div>
</div>
