<!-- login.component.html -->
<div class="flex min-h-screen items-center justify-center bg-gray-100 clsbg">
  <div class="flex flex-col md:flex-row bg-white rounded-xl shadow-lg overflow-hidden max-w-4xl w-full">
    <div class="w-full md:w-1/2 p-8">
      <h2 class="text-3xl font-bold text-emerald-green mb-2 text-center md:text-left font-['Montserrat']">
        Welcome back!
      </h2>
      <p class="text-gray-500 mb-6 text-center md:text-left font-['Open Sans']">
        Enter your Credentials to access your account
      </p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <input
            type="email"
            formControlName="email"
            placeholder="Enter your email"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-green font-['Open Sans']"
          />
        </div>

        <div class="relative">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-green font-['Open Sans']"
          />
          <button
            type="button"
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
          >
            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>

        <div class="text-sm text-gray-500 text-center font-['Open Sans']">
          <div class="flex items-center justify-center">
            <input type="checkbox" formControlName="rememberMe"
                   class="mr-2 h-4 w-4 text-emerald-green focus:ring-emerald-green"/>
            Remember for 30 days
          </div>
          <div class="flex justify-center space-x-6 mt-2">
            <a href="#" class="text-emerald-green hover:underline" (click)="openChangePasswordModal($event)">
              Change password
            </a>
          </div>
        </div>

        <button
          type="submit"
          class="w-full py-2 bg-emerald-green text-white rounded-lg active:bg-navy-blue transition duration-300 font-['Open Sans']"
        >
          Login
        </button>
      </form>

      <div class="flex items-center my-6">
        <hr class="flex-grow border-gray-300"/>
        <span class="mx-3 text-gray-400 font-['Open Sans']">or</span>
        <hr class="flex-grow border-gray-300"/>
      </div>

      <div class="flex flex-col md:flex-row justify-between space-y-4 md:space-y-0 md:space-x-4">
        <button class="flex-1 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-100 font-['Open Sans']">
          <i class="fab fa-google mr-2"></i> Sign in with Google
        </button>
        <button class="flex-1 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-100 font-['Open Sans']">
          <i class="fab fa-apple mr-2"></i> Sign in with Apple
        </button>
      </div>

      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600 font-['Open Sans']">
          Don't have an account?
          <a routerLink="/auth/signup" class="text-emerald-green">Sign Up</a>
        </p>
      </div>
    </div>

    <div class="w-full md:w-1/2 h-64 md:h-auto bg-cover bg-center rounded-l-xl"
         style="background-image: url('doctor.jpeg');">
    </div>
  </div>
</div>

<!-- Modal for Change Password (igual que antes, sin cambios en visibilidad) -->

  <!-- ... contenido del modal ... -->
</div>
