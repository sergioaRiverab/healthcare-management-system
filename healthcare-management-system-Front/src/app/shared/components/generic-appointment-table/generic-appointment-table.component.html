<table mat-table [dataSource]="data" class="mat-elevation-z8 w-full">
  
  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>ID</th>
    <td mat-cell *matCellDef="let row">{{ row.id }}</td>
  </ng-container>

  <!-- Date Column -->
  <ng-container matColumnDef="date">
    <th mat-header-cell *matHeaderCellDef>Date</th>
    <td mat-cell *matCellDef="let row">{{ row.date | date: 'short' }}</td>
  </ng-container>

  <!-- Status Column -->
  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let row">{{ row.status }}</td>
  </ng-container>

  <!-- Actions Column -->
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let row">
      <ng-container *ngFor="let action of actions">
        <button
          *ngIf="action.callback"
          mat-button
          [ngClass]="action.class"
          (click)="action.callback(row)"
        >
          {{ action.label }}
        </button>
        <a
          *ngIf="action.hrefFn"
          mat-button
          [href]="action.hrefFn(row)"
          [target]="action.openInNewTab ? '_blank' : '_self'"
          [ngClass]="action.class"
        >
          {{ action.label }}
        </a>
      </ng-container>
    </td>
  </ng-container>

  <!-- Table Header and Rows -->
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>
