<header class="bg-white shadow-md">
  <div class="container mx-auto px-6 py-6 flex justify-between items-center">
    <!-- Logo + título -->
    <div class="flex items-center space-x-8">
      <img
        src="/assets/logo.png"
        alt="MediCare Hospital Logo"
        class="h-28 w-28 object-contain transition-transform duration-300 hover:scale-105 filter drop-shadow-xl"
      />
      <h1 class="text-xl font-bold text-gray-800 tracking-tight font-['Montserrat']">
        MediCare Hospital
      </h1>
    </div>

    <!-- Enlaces de navegación -->
    <div class="hidden md:flex space-x-8">
      <a
        href="#features"
        class="text-gray-600 hover:text-teal-600 transition-colors duration-300 font-['Open Sans']"
      >
        Features
      </a>
      <a
        href="#about"
        class="text-gray-600 hover:text-teal-600 transition-colors duration-300 font-['Open Sans']"
      >
        About
      </a>
      <a
        href="#contact"
        class="text-gray-600 hover:text-teal-600 transition-colors duration-300 font-['Open Sans']"
      >
        Contact
      </a>

      <!-- Dashboard solo si está autenticado -->
      @if (isAuthenticated) {
        <a
          routerLink="/dashboard"
          class="text-gray-600 hover:text-teal-600 transition-colors duration-300 font-['Open Sans']"
        >
          Dashboard
        </a>
      }
    </div>

    <!-- Botón Login o perfil de usuario -->
    <div class="flex space-x-4">
      @if (!isAuthenticated) {
        <a
          routerLink="/auth/login"
          class="px-6 py-3 bg-teal-600 text-white rounded-lg hover:bg-teal-700 transition-all duration-300 font-medium flex items-center space-x-2 font-['Open Sans']"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
          <span>Login</span>
        </a>
      } @else {
        <div class="z-10 ">
          <app-user-profile></app-user-profile>
        </div>
      }
    </div>
  </div>
</header>
